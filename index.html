<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Endless Runner · Taller PWA</title>
  <link rel="stylesheet" href="style.css">

  <!-- PWA: manifiesto, color de la barra y soporte para iPhone -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f172a">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Runner">
</head>
<body>
  <main id="game-container">
    <canvas id="gameCanvas" width="800" height="400"></canvas>
    <div id="hud">
      <span id="score">Puntos: 0</span>
      <span id="best">Récord: 0</span>
      <button id="restartBtn" hidden>Reintentar</button>
    </div>
    <p id="instructions">Toca la pantalla o presiona <strong>Espacio</strong> para saltar</p>
  </main>

  <script src="game.js"></script>

  <!-- COMPLETA (Paso 7): quita las marcas de comentario de las líneas de abajo
       (las que dicen  /*  y  */ ) para registrar el service worker. -->
  <script>
    
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .then(() => console.log('✅ Service Worker registrado'))
          .catch(err => console.error('❌ Error al registrar el SW:', err));
      });
    }
    
  </script>
</body>
</html>
